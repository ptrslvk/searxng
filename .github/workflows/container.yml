---
name: Container

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Integration
    types:
      - completed
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  build:
    if: |
      github.event_name == 'workflow_dispatch'
      || (github.repository_owner == 'ptrslvk' && github.event.workflow_run.conclusion == 'success')
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64

    outputs:
      docker_tag: ${{ steps.build.outputs.docker_tag }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: "${{ github.event.workflow_run.head_sha || github.sha }}"
          persist-credentials: "false"
          fetch-depth: "0"

      - name: Setup cache Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: "python-${{ env.PYTHON_VERSION }}-${{ runner.arch }}-${{ hashFiles('./requirements*.txt') }}"
          restore-keys: |
            python-${{ env.PYTHON_VERSION }}-${{ runner.arch }}-
          path: "./local/"

      - name: Setup cache container
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: "container-${{ matrix.arch }}-${{ hashFiles('./requirements*.txt') }}"
          restore-keys: |
            container-${{ matrix.arch }}-
          path: "/var/tmp/buildah-cache-*/*"

      - name: Build
        id: build
        env:
          OVERRIDE_ARCH: "${{ matrix.arch }}"
        run: make container.build

      - name: Upload container image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: container-image-${{ matrix.arch }}
          path: "/var/tmp/searxng-podman/*.tar"
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64

    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: "${{ github.event.workflow_run.head_sha || github.sha }}"
          persist-credentials: "true"

      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: container-image-${{ matrix.arch }}
          path: "/var/tmp/searxng-podman"
          merge-multiple: true

      - name: Test
        env:
          OVERRIDE_ARCH: "${{ matrix.arch }}"
        run: make container.test

  release:
    if: github.repository_owner == 'ptrslvk' && github.ref_name == 'master'
    name: Release
    runs-on: ubuntu-26.04-arm
    needs:
      - build
      - test

    permissions:
      packages: write

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: "docker.io"
          username: "${{ secrets.DOCKER_USER }}"
          password: "${{ secrets.DOCKER_TOKEN }}"

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0  # v4.6.0
        with:
          registry: "ghcr.io"
          username: "ptrslvk"
          password: "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"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: "${{ github.event.workflow_run.head_sha || github.sha }}"
          persist-credentials: "true"

      - name: Download container images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: container-image-*
          path: "/var/tmp/searxng-podman"
          merge-multiple: true

      - name: Release
        env:
          DOCKER_TAG: "${{ needs.build.outputs.docker_tag }}"
        run: make container.push
